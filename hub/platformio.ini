;upload_port = 192.168.1.14
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../shared
build_flags = 
    -D ESPNOW_ENABLED
    -D TCP_ENABLED
    -D CORE_DEBUG_LEVEL=0
    -D ASYNC_WEB_ENABLED
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2
    -D CONFIG_LWIP_MAX_SOCKETS=16
    -D STATIC_WIFI
    -D WIFI_SSID=\"kcasa\"
    -D WIFI_PASS=\"3938373635\"
    -D WIFI2_SSID=\"micasa\"
    -D WIFI2_PASS=\"3938373635\"
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0

[env:hub_lora]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.offset_address = 0x20000
lib_extra_dirs = ../shared
build_flags = 
    -D ASYNC_WEB_ENABLED
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2
    -D CONFIG_LWIP_MAX_SOCKETS=16
    -D STATIC_WIFI
    -D WIFI_SSID=\"kcasa\"
    -D WIFI_PASS=\"3938373635\"
    
lib_deps = 
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0


[env:hub_32_lora]
extends = env:hub_lora
build_flags =
    ${env:hub_lora.build_flags}
    -D LORA_ENABLED
    -D DISPLAY_TTGO

lib_deps =
    ${env:hub_lora.lib_deps}
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:hub_32_lora_heltec]
extends = env:hub_lora
build_flags =
    ${env:hub_lora.build_flags}
    -D HELTEC_W32LA
    -D LORA_ENABLED
    -D ESPNOW_ENABLED
    -D TCP_ENABLED
    -D DISPLAY_HELTEC
lib_deps =
    ${env:hub_lora.lib_deps}
    sandeepmistry/LoRa @ ^0.8.0
    eiannone/Heltec_Esp32_Display @ ^0.1.0

[env:hub_NRF24]
build_flags = 
    -D NRF24_ENABLED
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2

[env:hub_radio433]
build_flags = 
    -D RADIO433_ENABLED
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2    