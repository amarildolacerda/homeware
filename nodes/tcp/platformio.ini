[platformio]
default_envs = esp8266

[env]
build_flags = -Wall -std=gnu++17
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_ldf_mode = deep
lib_extra_dirs =
    ../../shared
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.0

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
lib_extra_dirs = ../../shared
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    ${env.build_flags}
    -DTCP_NODE

[env:esp8266_ota]
platform = espressif8266
board = d1_mini
framework = arduino
lib_extra_dirs = ../../shared
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    ${env.build_flags}
    -DTCP_NODE
    -DSTATIC_WIFI
    -DWIFI_SSID=\"kcasa\"
    -DWIFI_PASS=\"3938373635\"
lib_deps =
    ${env.lib_deps}
upload_protocol = espota
upload_port = 192.168.1.100
upload_flags =
    --port=8266
    --auth=
