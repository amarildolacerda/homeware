; nodes/onoff-lora-avr/platformio.ini
[env:nano_lora]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
    mikem/RadioHead @ ^1.120
build_flags =
    -DLORA_RX_PIN=2
    -DLORA_TX_PIN=3
    -DRELAY_PIN=5
    -DBUTTON_PIN=6
    -DLED_PIN=4
    -DLORA_FREQ=868.0
    -DLORA_SF=10
    -DLORA_BW=125
    -DLORA_CR=7
    -DLORA_TX_POWER=17
