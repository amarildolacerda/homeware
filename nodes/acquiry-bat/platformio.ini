[env:esp8266_tcp]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_extra_dirs =
    ../../shared
build_flags =
    ;-D ESPNOW_ENABLED
    -DWIFI_ENABLED
    -DTCP_ENABLED
    -DWIFI_SSID=\"micasa\"
    -DWIFI_PASS=\"3938373635\"
    -DWIFI_CHANNEL=1
    -DWIFI2_SSID=\"kcasa\"
    -DWIFI2_PASS=\"3938373635\"
    -DWIFI2_CHANNEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.16

[env:esp8266_ota]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_protocol = espota
upload_port = 192.168.1.53
lib_extra_dirs =
    ../../shared
build_flags =
    -DWIFI_ENABLED
    -DTCP_ENABLED
    -DWIFI_SSID=\"micasa\"
    -DWIFI_PASS=\"3938373635\"
    -DWIFI_CHANNEL=1
    -DWIFI2_SSID=\"kcasa\"
    -DWIFI2_PASS=\"3938373635\"
    -DWIFI2_CHANNEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.16

[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    ../../shared
build_flags =
    -DWIFI_ENABLED
    -DTCP_ENABLED
    -DWIFI_SSID=\"micasa\"
    -DWIFI_PASS=\"3938373635\"
    -DWIFI_CHANNEL=1
    -DWIFI2_SSID=\"kcasa\"
    -DWIFI2_PASS=\"3938373635\"
    -DWIFI2_CHANNEL=1
    -D WIFI_CHANNEL=4
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.16

; Variante ESP-NOW (mutuamente exclusiva com WIFI_ENABLED/TCP_ENABLED)
[env:esp8266_espnow]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_extra_dirs =
    ../../shared
build_flags =
    -DESPNOW_ENABLED
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.16