[platformio]
src_dir = .

; ============================================================
; Shared
; ============================================================
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_extra_dirs = shared
lib_deps =
    bblanchon/ArduinoJson @ ^7
build_flags = -Wall -std=gnu++17

; ============================================================
; Hub ESP8266
; ============================================================
[env:hub_8266]
platform = espressif8266
board = d1_mini
build_src_filter = +<hub/src/**> -<hub/.pio/**>
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
upload_speed = 115200
lib_extra_dirs = shared
build_flags =
    ${env.build_flags}
    -Ihub/include
    -Ihub/src
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2
    -D MQTT_HOST_DEFAULT=\"192.168.1.12\"
    -D MQTT_PORT_DEFAULT=1883
    -D MQTT_USER_DEFAULT=\"kzuca\"
    -D MQTT_PASS_DEFAULT=\"123\"
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17

[env:hub_8266_ota]
extends = env:hub_8266
upload_protocol = espota
upload_port = 192.168.1.15

; ============================================================
; Hub ESP32
; ============================================================
[env:hub_32]
platform = espressif32
board = esp32dev
monitor_filters = esp32_exception_decoder
build_src_filter = +<hub/src/**> -<hub/.pio/**>
board_build.flash_mode = dio
board_build.partitions = hub/partitions.csv
board_upload.offset_address = 0x20000
lib_extra_dirs = shared
build_flags =
    ${env.build_flags}
    -Ihub/include
    -Ihub/src
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2
    -D CONFIG_LWIP_MAX_SOCKETS=16
    -D STATIC_WIFI
    -D WIFI_SSID=\"kcasa\"
    -D WIFI_PASS=\"3938373635\"
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8

[env:hub_32_ota]
extends = env:hub_32
upload_protocol = espota
upload_port = 192.168.1.14

; ============================================================
; Hub ESP32-C3
; ============================================================
[env:hub_32c3]
platform = espressif32
board = esp32-c3-devkitm-1
monitor_port = COM5
monitor_filters = esp32_exception_decoder
build_src_filter = +<hub/src/**> -<hub/.pio/**>
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = hub/partitions.csv
board_upload.offset_address = 0x20000
upload_port = COM5
lib_extra_dirs = shared
build_flags =
    ${env.build_flags}
    -Ihub/include
    -Ihub/src
    -D HEARTBEAT_INTERVAL_MS=30000
    -D SENSOR_TIMEOUT_MS=300000
    -D PAIR_BUTTON_GPIO=0
    -D STATUS_LED_GPIO=2
    -D CONFIG_LWIP_MAX_SOCKETS=16
    -D STATIC_WIFI
    -D WIFI_SSID=\"kcasa\"
    -D WIFI_PASS=\"3938373635\"
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8




; ============================================================
; Lamp
; ============================================================
[env:lamp]
platform = espressif8266
board = d1_mini
build_src_filter = +<nodes/lamp/src/**> -<nodes/lamp/.pio/**>
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m1m.ld
lib_extra_dirs = shared
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager @ ^0.16
    Aircoookie/Espalexa @ ^2.7.0
build_flags =
    ${env.build_flags}
    -Inodes/lamp/include
    -DHABILITA_REPEATER
    -DHABILITA_ALEXA
    -DHABILITA_PINOS

[env:lamp_ota]
extends = env:lamp
upload_protocol = espota
upload_port = 192.168.1.41

; ============================================================
; Switch
; ============================================================
[env:switch]
platform = espressif8266
board = d1_mini
build_src_filter = +<nodes/switch/src/**> -<nodes/switch/.pio/**>
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
