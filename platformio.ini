; ============================================================
; Presence
; ============================================================
[env:presence]
platform = espressif8266
board = nodemcuv2
build_src_filter = +<nodes/presence/src/**> -<nodes/presence/.pio/**>
board_build.filesystem = littlefs
board_build.flash_size = 4MB
board_build.filesystem_size = 1MB
lib_extra_dirs = shared
build_flags =
    ${env.build_flags}
    -Inodes/presence/include
    -D ESPNOW_CHANNEL=1
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager@^2.0.0

[env:presence_ota]
extends = env:presence
upload_protocol = espota

